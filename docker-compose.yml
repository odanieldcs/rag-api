services:
  qdrant:
    container_name: rag-vector-store_2
    image: qdrant/qdrant
    restart: always
    platform: linux/amd64 # Apple Silicon, M1, M2...
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    ports:
      - 127.0.0.1:6333:6333
    volumes:
      - ./data/qdrant:/qdrant/storage

volumes:
  tmp_vector_store: